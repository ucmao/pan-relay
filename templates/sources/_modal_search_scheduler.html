<!-- 全局搜索调度参数模态框 -->
<div class="modal fade" id="searchSettingsModal" tabindex="-1" aria-labelledby="searchSettingsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="searchSettingsModalLabel">
                    <i class="fas fa-sliders-h text-blue-600 me-1.5"></i> 搜索调度参数设置
                </h5>
                <button type="button" class="btn-close" data-ui-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body space-y-5">
                <p class="text-xs text-slate-500 mb-1">集中配置 API 接口、插件扩展与 Telegram 频道的并发线程数与单次超时规则</p>
                
                <!-- 1. API 接口调度 -->
                <div class="p-4 bg-slate-50 border border-slate-200/80 rounded-2xl space-y-3">
                    <div class="flex items-center gap-2 font-bold text-xs text-slate-800 border-b border-slate-200/60 pb-2">
                        <i class="fas fa-code text-blue-500"></i> API 接口调度
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="apiTimeoutInput" class="block text-xs font-semibold text-slate-700 mb-1.5">
                                单 API 请求超时（秒）
                            </label>
                            <input type="number"
                                class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 text-xs text-slate-800"
                                id="apiTimeoutInput" min="1" max="60" value="10">
                        </div>
                        <div>
                            <label for="apiMaxWorkersInput" class="block text-xs font-semibold text-slate-700 mb-1.5">
                                API 并发线程数
                            </label>
                            <input type="number"
                                class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 text-xs text-slate-800"
                                id="apiMaxWorkersInput" min="1" max="32" value="8">
                        </div>
                    </div>
                </div>

                <!-- 2. 插件扩展调度 -->
                <div class="p-4 bg-slate-50 border border-slate-200/80 rounded-2xl space-y-3">
                    <div class="flex items-center gap-2 font-bold text-xs text-slate-800 border-b border-slate-200/60 pb-2">
                        <i class="fas fa-puzzle-piece text-indigo-500"></i> 插件扩展调度
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="pluginTimeoutInput" class="block text-xs font-semibold text-slate-700 mb-1.5">
                                单插件总超时（秒）
                            </label>
                            <input type="number"
                                class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 text-xs text-slate-800"
                                id="pluginTimeoutInput" min="1" max="120" value="10">
                        </div>
                        <div>
                            <label for="pluginMaxWorkersInput" class="block text-xs font-semibold text-slate-700 mb-1.5">
                                插件并发线程数
                            </label>
                            <input type="number"
                                class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 text-xs text-slate-800"
                                id="pluginMaxWorkersInput" min="1" max="32" value="6">
                        </div>
                    </div>
                </div>

                <!-- 3. Telegram 抓取调度 -->
                <div class="p-4 bg-slate-50 border border-slate-200/80 rounded-2xl space-y-3">
                    <div class="flex items-center gap-2 font-bold text-xs text-slate-800 border-b border-slate-200/60 pb-2">
                        <i class="fab fa-telegram-plane text-sky-500"></i> Telegram 抓取调度
                    </div>
                    <div class="space-y-3">
                        <div>
                            <label for="tgProxyInput" class="block text-xs font-semibold text-slate-700 mb-1.5">
                                Telegram 网络代理 (Proxy) <span class="text-slate-400 font-normal ml-1">（如 socks5://127.0.0.1:7890）</span>
                            </label>
                            <input type="text"
                                class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all font-mono text-xs text-slate-800"
                                id="tgProxyInput" placeholder="留空则使用系统直连">
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label for="tgTimeoutInput" class="block text-xs font-semibold text-slate-700 mb-1.5">
                                    单频道超时（秒）
                                </label>
                                <input type="number"
                                    class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 text-xs text-slate-800"
                                    id="tgTimeoutInput" min="1" max="60" value="10">
                            </div>
                            <div>
                                <label for="tgMaxWorkersInput" class="block text-xs font-semibold text-slate-700 mb-1.5">
                                    并发拉取线程数
                                </label>
                                <input type="number"
                                    class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 text-xs text-slate-800"
                                    id="tgMaxWorkersInput" min="1" max="16" value="4">
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            <div class="modal-footer">
                <button type="button"
                    class="px-3.5 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-200/60 rounded-xl"
                    data-ui-dismiss="modal">取消</button>
                <button type="button"
                    class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl"
                    id="saveTgSearchConfigBtn" onclick="saveTgSearchConfig()"><i class="fas fa-save text-[10px]"></i>
                    保存设置</button>
            </div>
        </div>
    </div>
</div>
