<!-- Telegram 频道检索 Tab -->
<div class="tab-pane-inner space-y-4">
    <section class="admin-panel">
        <div class="admin-panel-header">
            <div class="admin-panel-title-area">
                <h3 class="admin-panel-title"><i class="fas fa-satellite-dish text-sky-500"></i> Telegram 公开频道列表</h3>
                <p class="admin-panel-desc">逐个管理频道状态；检测结果只更新健康状态，不会自动停用频道</p>
            </div>
            <div class="flex items-center space-x-2 flex-wrap">
                <button class="btn btn-outline-primary btn-sm" onclick="batchTestTgChannels(true)" title="全盘检测所有 Telegram 频道连通性">
                    <i class="fas fa-stethoscope text-[10px]"></i> 全部检测
                </button>
                <button class="btn btn-primary btn-sm" data-ui-modal-target="#addTgChannelModal"><i
                        class="fas fa-plus text-[10px]"></i> 新增频道</button>
            </div>
        </div>

        <!-- Telegram 悬浮批量操作栏 -->
        <div class="batch-floating-toolbar" id="tgBatchToolbar" role="toolbar" aria-label="频道批量操作栏">
            <div class="resource-batch-summary">
                <i class="fas fa-check-circle text-blue-600"></i>
                <span>已选 <strong id="tgSelectedCount" class="text-blue-600 font-bold">0</strong> 项</span>
                <button class="resource-batch-scope-link" id="tgScopeToggleLink" onclick="toggleTgSelectAllMode()" type="button" style="display: none;"></button>
                <span class="resource-batch-summary-divider"></span>
                <button class="resource-batch-btn-clear" onclick="clearTgSelection()" type="button" title="清空选择">
                    <i class="fas fa-times"></i> 清空
                </button>
            </div>
            <div class="resource-batch-actions">
                <button class="btn btn-info btn-sm" onclick="batchTestTgChannels()" type="button" title="测试选中的 Telegram 频道连通性">
                    <i class="fas fa-stethoscope"></i> 测试所选
                </button>
                <button class="btn btn-primary btn-sm" onclick="batchEnableTgChannels(true)" type="button">
                    <i class="fas fa-play"></i> 批量启用
                </button>
                <button class="btn btn-secondary btn-sm" onclick="batchEnableTgChannels(false)" type="button">
                    <i class="fas fa-ban"></i> 批量停用
                </button>
                <button class="btn btn-danger btn-sm" onclick="batchDeleteTgChannels()" type="button">
                    <i class="fas fa-trash-alt"></i> 批量删除
                </button>
            </div>
        </div>

        <div class="data-table-shell">
            <table class="table">
                <thead class="select-none">
                    <tr>
                        <th style="width: 44px; text-align: center;">
                            <input class="form-check-input" type="checkbox" id="selectTgPageCheckbox" onchange="toggleSelectTgPage(this)" title="选择当前页">
                        </th>
                        <th style="width: 50px; text-align: center; cursor: pointer;" onclick="handleTgSort('id')" title="点击按序号排序">
                            # <span id="tgSortIconId" class="text-blue-600 font-bold ml-0.5">↓</span>
                        </th>
                        <th style="cursor: pointer;" onclick="handleTgSort('title')" title="点击按频道名称排序">
                            频道名称 <span id="tgSortIconTitle" class="text-slate-300 ml-0.5">↕</span>
                        </th>
                        <th style="width: 130px; cursor: pointer;" onclick="handleTgSort('channel')" title="点击按频道标识排序">
                            频道标识 <span id="tgSortIconChannel" class="text-slate-300 ml-0.5">↕</span>
                        </th>
                        <th style="width: 95px; text-align: center; cursor: pointer;" onclick="handleTgSort('is_enabled')" title="点击按启用状态排序">
                            启用状态 <span id="tgSortIconIsEnabled" class="text-slate-300 ml-0.5">↕</span>
                        </th>
                        <th style="width: 90px; text-align: center; cursor: pointer;" onclick="handleTgSort('health_status')" title="点击按健康状态排序">
                            健康状态 <span id="tgSortIconHealthStatus" class="text-slate-300 ml-0.5">↕</span>
                        </th>
                        <th style="width: 90px; text-align: center; cursor: pointer;" onclick="handleTgSort('latency_ms')" title="点击按耗时排序">
                            耗时 <span id="tgSortIconLatencyMs" class="text-slate-300 ml-0.5">↕</span>
                        </th>
                        <th style="width: 170px; text-align: center; cursor: pointer;" onclick="handleTgSort('checked_at')" title="点击按最近检测时间排序">
                            最近检测 <span id="tgSortIconCheckedAt" class="text-slate-300 ml-0.5">↕</span>
                        </th>
                        <th style="width: 210px; text-align: center;">操作</th>
                    </tr>
                </thead>
                <tbody id="tgChannelTableBody">
                    <tr>
                        <td colspan="8" class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin me-2"></i>
                            正在加载频道列表...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 分页栏 (全站统一 Slate 规范) -->
        <div class="px-5 py-4 border-t border-slate-100 flex flex-col md:flex-row justify-between items-center gap-4 text-xs font-sans text-slate-500">
            <div class="flex items-center gap-2 text-xs text-slate-500">
                <span>每页显示</span>
                <select id="tgPageSizeSelect" onchange="handleTgPageSizeChange(this.value)"
                    class="px-2 py-1 text-xs rounded-lg border border-slate-200 bg-white text-slate-700 focus:outline-none focus:border-blue-500 cursor-pointer">
                    <option value="15" selected>15 条</option>
                    <option value="30">30 条</option>
                    <option value="50">50 条</option>
                    <option value="100">100 条</option>
                </select>
                <span class="text-slate-400">第 <span id="tgCurrentPageNum">1</span> / <span id="tgTotalPageNum">1</span> 页（共 <span id="tgTotalCountNum">0</span> 条）</span>
            </div>
            <div class="flex items-center gap-3 flex-wrap">
                <div class="flex items-center space-x-1.5" id="tgPaginationControls"></div>
                <div class="flex items-center gap-1.5 text-xs text-slate-500 border-l border-slate-200 pl-3">
                    <span>跳至</span>
                    <input type="number" id="tgJumpPageInput" min="1" value="1"
                        class="w-14 px-2 py-1 text-xs text-center rounded-lg border border-slate-200 bg-white text-slate-700 focus:outline-none focus:border-blue-500"
                        onkeydown="if(event.key==='Enter'){handleTgJumpPage();}">
                    <span>页</span>
                    <button type="button" onclick="handleTgJumpPage()"
                        class="px-2.5 py-1 text-xs rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition cursor-pointer">跳转</button>
                </div>
            </div>
        </div>
    </section>
</div>

<div class="modal fade" id="addTgChannelModal" tabindex="-1" aria-labelledby="addTgChannelModalLabel"
    aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addTgChannelModalLabel"><i class="fab fa-telegram-plane text-sky-500"></i>
                    新增公开频道</h5>
                <button type="button" class="btn-close" data-ui-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body space-y-4">
                <div>
                    <label for="newTgChannelInput"
                        class="block text-xs font-semibold text-slate-700 mb-1.5">频道用户名或公开链接</label>
                    <input type="text"
                        class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all font-mono text-xs text-slate-800"
                        id="newTgChannelInput" placeholder="例如：tgsearchers7 或 https://t.me/tgsearchers7">
                </div>
                <div>
                    <label for="newTgChannelEnabled"
                        class="block text-xs font-semibold text-slate-700 mb-1.5">初始状态</label>
                    <select
                        class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800"
                        id="newTgChannelEnabled">
                        <option value="true">启用</option>
                        <option value="false">停用</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button"
                    class="px-3.5 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-200/60 rounded-xl"
                    data-ui-dismiss="modal">取消</button>
                <button type="button"
                    class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl"
                    id="addTgChannelButton" onclick="addTgChannel()"><i class="fas fa-save text-[10px]"></i> 保存</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="tgTestModal" tabindex="-1" aria-labelledby="tgTestModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tgTestModalLabel"><i class="fas fa-vial text-sky-500"></i> <span
                        id="tgTestTitle">频道连通性测试</span></h5>
                <button type="button" class="btn-close" data-ui-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body space-y-3">
                <div class="p-3 bg-blue-50 border border-blue-200/60 rounded-xl text-xs text-blue-800 font-medium"
                    id="tgTestStatusAlert"></div>
                <div class="border border-slate-200/80 rounded-xl overflow-hidden shadow-2xs"
                    style="max-height: 280px; overflow-y: auto;">
                    <table class="table mb-0">
                        <thead>
                            <tr>
                                <th style="width: 50px; text-align: center;">#</th>
                                <th>标题</th>
                                <th style="width: 90px;">网盘</th>
                                <th>链接 / 提取码</th>
                            </tr>
                        </thead>
                        <tbody id="tgTestTableBody" class="divide-y divide-slate-100 text-xs"></tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer"><button type="button"
                    class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-200/60 rounded-xl"
                    data-ui-dismiss="modal">关闭</button></div>
        </div>
    </div>
</div>
