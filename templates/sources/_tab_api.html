<!-- API 检索源 Tab -->
<div class="tab-pane-inner">
    <!-- API 列表面板 -->
    <section class="admin-panel">
        <div class="admin-panel-header">
            <div class="admin-panel-title-area">
                <h3 class="admin-panel-title">
                    <i class="fas fa-code"></i> 第三方 API 检索源
                </h3>
                <p class="admin-panel-desc">配置外部搜索接口与 JMESPath 提取规则，支持在线自检与全局启停</p>
            </div>
            <div class="flex items-center space-x-2">
                <button class="btn btn-primary btn-sm" data-ui-modal-target="#addApiModal">
                    <i class="fas fa-plus text-[10px]"></i> 新建 API
                </button>
                <button class="btn btn-outline-primary btn-sm" id="testAllApiButton">
                    <i class="fas fa-vial text-[10px]"></i> 全部测试
                </button>
                <button class="btn btn-outline-primary btn-sm" id="enableAllButton">
                    <i class="fas fa-play text-[10px]"></i> 全部启用
                </button>
                <button class="btn btn-outline-secondary btn-sm" id="disableAllButton">
                    <i class="fas fa-ban text-[10px]"></i> 全部禁用
                </button>
            </div>
        </div>

        <div class="data-table-shell" style="max-height: 620px; overflow-y: auto;">
            <table class="table">
                <thead>
                    <tr>
                        <th style="width: 50px; text-align: center;">#</th>
                        <th style="width: 150px;">名称</th>
                        <th style="width: 85px; text-align: center;">启用状态</th>
                        <th style="width: 80px; text-align: center;">健康状态</th>
                        <th style="width: 170px; text-align: center;">最近检测</th>
                        <th>接口 URL</th>
                        <th style="width: 90px; text-align: center;">耗时</th>
                        <th style="width: 160px; text-align: center;">操作</th>
                    </tr>
                </thead>
                <tbody id="apiTableBody">
                    <tr>
                        <td colspan="8" class="text-center text-muted py-4">
                            <i class="fas fa-spinner fa-spin me-2"></i> 正在加载 API 列表...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>

<!-- 新建 API 模态框 -->
<div class="modal fade" id="addApiModal" tabindex="-1" aria-labelledby="addApiModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addApiModalLabel">
                    <i class="fas fa-plus-circle text-blue-600"></i>
                    <span>新建 API 检索源</span>
                </h5>
                <button type="button" class="btn-close" data-ui-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <form id="addApiForm" class="space-y-4">
                    <!-- 分组 1: 基础参数 -->
                    <div class="bg-slate-50/70 p-4 rounded-xl border border-slate-200/70 space-y-3">
                        <div class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                            <i class="fas fa-info-circle text-blue-500 text-xs"></i>
                            <span>基础信息</span>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
                            <div class="sm:col-span-6">
                                <label for="apiName" class="block text-xs font-semibold text-slate-700 mb-1.5">
                                    接口名称 <span class="text-rose-500">*</span>
                                </label>
                                <input type="text" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-xs font-medium text-slate-800" id="apiName" placeholder="例如：某网盘搜索源1" required>
                            </div>
                            <div class="sm:col-span-3">
                                <label for="apiMethod" class="block text-xs font-semibold text-slate-700 mb-1.5">
                                    请求方法 <span class="text-rose-500">*</span>
                                </label>
                                <select class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-xs font-medium text-slate-800 cursor-pointer" id="apiMethod" required>
                                    <option value="get">GET</option>
                                    <option value="post" selected>POST</option>
                                </select>
                            </div>
                            <div class="sm:col-span-3">
                                <label for="apiIsEnabled" class="block text-xs font-semibold text-slate-700 mb-1.5">
                                    默认状态 <span class="text-rose-500">*</span>
                                </label>
                                <select class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-xs font-medium text-slate-800 cursor-pointer" id="apiIsEnabled" required>
                                    <option value="true">启用</option>
                                    <option value="false">禁用</option>
                                </select>
                            </div>
                            <div class="sm:col-span-12">
                                <label for="apiUrl" class="block text-xs font-semibold text-slate-700 mb-1.5">
                                    接口 URL <span class="text-rose-500">*</span>
                                    <span class="text-slate-400 font-normal ml-1">（需嵌入 <code>[[keyword]]</code> 作为关键词占位符）</span>
                                </label>
                                <input type="text" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all font-mono text-xs text-slate-800" id="apiUrl" placeholder="例：https://api.example.com/search?q=[[keyword]]" required>
                            </div>
                        </div>
                    </div>

                    <!-- 分组 2: 请求体配置 -->
                    <div class="bg-slate-50/70 p-4 rounded-xl border border-slate-200/70 space-y-3">
                        <div class="flex items-center justify-between">
                            <div class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                                <i class="fas fa-file-code text-indigo-500 text-xs"></i>
                                <span>请求体配置 (JSON)</span>
                            </div>
                            <button type="button" class="px-2.5 py-1 text-[11px] font-semibold text-slate-600 bg-white hover:bg-slate-100 border border-slate-200 rounded-lg shadow-2xs transition-all flex items-center gap-1 cursor-pointer" onclick="formatJson('apiRequest')">
                                <i class="fas fa-magic text-slate-400 text-[10px]"></i> 格式化
                            </button>
                        </div>
                        <div>
                            <textarea class="w-full p-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all font-mono text-xs text-slate-800" id="apiRequest" rows="3" placeholder='POST 请求可留空或配置 JSON，例如：{"query": "[[keyword]]"}'></textarea>
                        </div>
                    </div>

                    <!-- 分组 3: 响应解析规则 -->
                    <div class="bg-slate-50/70 p-4 rounded-xl border border-slate-200/70 space-y-3">
                        <div class="flex items-center justify-between">
                            <div class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                                <i class="fas fa-filter text-emerald-500 text-xs"></i>
                                <span>响应解析规则 (JMESPath) <span class="text-rose-500">*</span></span>
                            </div>
                            <a href="https://jmespath.org/tutorial.html" target="_blank" class="text-[11px] text-blue-600 hover:text-blue-700 flex items-center gap-1">
                                <span>JMESPath 教程</span>
                                <i class="fas fa-external-link-alt text-[9px]"></i>
                            </a>
                        </div>
                        <div>
                            <textarea class="w-full p-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all font-mono text-xs text-slate-800" id="apiResponse" rows="2" placeholder="例：data[*].[name, url]" required></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer flex items-center justify-between">
                <div>
                    <button type="button" class="px-3 py-1.5 text-xs font-semibold text-blue-600 bg-blue-50 hover:bg-blue-100 border border-blue-200/60 rounded-xl transition-colors flex items-center gap-1.5 cursor-pointer" id="apiTestButton" onclick="testDraftApi('api')">
                        <i class="fas fa-play text-[10px]"></i> 测试连通性
                    </button>
                </div>
                <div class="flex items-center space-x-2">
                    <button type="button" class="px-3.5 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-200/60 rounded-xl transition-colors cursor-pointer" onclick="document.getElementById('addApiForm').reset()">
                        重置
                    </button>
                    <button type="button" class="px-3.5 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-200/60 rounded-xl transition-colors cursor-pointer" data-ui-dismiss="modal">
                        取消
                    </button>
                    <button type="button" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl transition-all shadow-2xs flex items-center gap-1.5 cursor-pointer" onclick="addApi()">
                        <i class="fas fa-save text-[10px]"></i> 保存入库
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 修改 API 模态框 -->
<div class="modal fade" id="editApiModal" tabindex="-1" aria-labelledby="editApiModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editApiModalLabel">
                    <i class="fas fa-edit text-blue-600"></i>
                    <span>修改 API 检索源</span>
                </h5>
                <button type="button" class="btn-close" data-ui-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <form id="editApiForm" class="space-y-4">
                    <input type="hidden" id="editApiId">

                    <!-- 分组 1: 基础信息 -->
                    <div class="bg-slate-50/70 p-4 rounded-xl border border-slate-200/70 space-y-3">
                        <div class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                            <i class="fas fa-info-circle text-blue-500 text-xs"></i>
                            <span>基础信息</span>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
                            <div class="sm:col-span-6">
                                <label for="editApiName" class="block text-xs font-semibold text-slate-700 mb-1.5">
                                    接口名称 <span class="text-rose-500">*</span>
                                </label>
                                <input type="text" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-xs font-medium text-slate-800" id="editApiName" required>
                            </div>
                            <div class="sm:col-span-3">
                                <label for="editApiMethod" class="block text-xs font-semibold text-slate-700 mb-1.5">
                                    请求方法 <span class="text-rose-500">*</span>
                                </label>
                                <select class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-xs font-medium text-slate-800 cursor-pointer" id="editApiMethod" required>
                                    <option value="get">GET</option>
                                    <option value="post">POST</option>
                                </select>
                            </div>
                            <div class="sm:col-span-3">
                                <label for="editApiIsEnabled" class="block text-xs font-semibold text-slate-700 mb-1.5">
                                    启用状态 <span class="text-rose-500">*</span>
                                </label>
                                <select class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-xs font-medium text-slate-800 cursor-pointer" id="editApiIsEnabled" required>
                                    <option value="true">启用</option>
                                    <option value="false">禁用</option>
                                </select>
                            </div>
                            <div class="sm:col-span-12">
                                <label for="editApiUrl" class="block text-xs font-semibold text-slate-700 mb-1.5">
                                    接口 URL <span class="text-rose-500">*</span>
                                    <span class="text-slate-400 font-normal ml-1">（需嵌入 <code>[[keyword]]</code> 作为关键词占位符）</span>
                                </label>
                                <input type="text" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all font-mono text-xs text-slate-800" id="editApiUrl" required>
                            </div>
                        </div>
                    </div>

                    <!-- 分组 2: 请求体配置 -->
                    <div class="bg-slate-50/70 p-4 rounded-xl border border-slate-200/70 space-y-3">
                        <div class="flex items-center justify-between">
                            <div class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                                <i class="fas fa-file-code text-indigo-500 text-xs"></i>
                                <span>请求体配置 (JSON)</span>
                            </div>
                            <button type="button" class="px-2.5 py-1 text-[11px] font-semibold text-slate-600 bg-white hover:bg-slate-100 border border-slate-200 rounded-lg shadow-2xs transition-all flex items-center gap-1 cursor-pointer" onclick="formatJson('editApiRequest')">
                                <i class="fas fa-magic text-slate-400 text-[10px]"></i> 格式化
                            </button>
                        </div>
                        <div>
                            <textarea class="w-full p-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all font-mono text-xs text-slate-800" id="editApiRequest" rows="3" placeholder='POST 请求可留空或配置 JSON，例如：{"text": "[[keyword]]"}'></textarea>
                        </div>
                    </div>

                    <!-- 分组 3: 响应解析规则 -->
                    <div class="bg-slate-50/70 p-4 rounded-xl border border-slate-200/70 space-y-3">
                        <div class="flex items-center justify-between">
                            <div class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                                <i class="fas fa-filter text-emerald-500 text-xs"></i>
                                <span>响应解析规则 (JMESPath) <span class="text-rose-500">*</span></span>
                            </div>
                            <a href="https://jmespath.org/tutorial.html" target="_blank" class="text-[11px] text-blue-600 hover:text-blue-700 flex items-center gap-1">
                                <span>JMESPath 语法教程</span>
                                <i class="fas fa-external-link-alt text-[9px]"></i>
                            </a>
                        </div>
                        <div>
                            <textarea class="w-full p-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all font-mono text-xs text-slate-800" id="editApiResponse" rows="2" placeholder="例：data[*].[name, url]" required></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer flex items-center justify-between">
                <div>
                    <button type="button" class="px-3 py-1.5 text-xs font-semibold text-blue-600 bg-blue-50 hover:bg-blue-100 border border-blue-200/60 rounded-xl transition-colors flex items-center gap-1.5 cursor-pointer" id="editApiTestButton" onclick="testDraftApi('editApi')">
                        <i class="fas fa-play text-[10px]"></i> 测试连通性
                    </button>
                </div>
                <div class="flex items-center space-x-2">
                    <button type="button" class="px-3.5 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-200/60 rounded-xl transition-colors cursor-pointer" data-ui-dismiss="modal">
                        取消
                    </button>
                    <button type="button" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl transition-all shadow-2xs flex items-center gap-1.5 cursor-pointer" onclick="saveEditedApi()">
                        <i class="fas fa-save text-[10px]"></i> 保存修改
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
