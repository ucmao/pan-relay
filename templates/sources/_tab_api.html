<!-- API 检索源 Tab -->
<div class="tab-pane-inner">
    <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
        <div>
            <h3 class="admin-panel-title mb-1">
                <i class="fas fa-code text-primary me-1"></i> 第三方 API 检索源治理
            </h3>
            <p class="admin-panel-desc mb-0">配置外部搜索接口、定制 JMESPath 数据提取规则，支持一键连通性测试与全局批量启停。</p>
        </div>
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-primary btn-sm" data-ui-modal-target="#addApiModal">
                <i class="fas fa-plus"></i> 新建 API
            </button>
            <button class="btn btn-success btn-sm" id="enableAllButton">
                <i class="fas fa-play"></i> 全部启用
            </button>
            <button class="btn btn-outline-secondary btn-sm" id="disableAllButton">
                <i class="fas fa-ban"></i> 全部禁用
            </button>
        </div>
    </div>

    <!-- API 列表面板 -->
    <section class="admin-panel">
        <div class="admin-panel-header">
            <div class="admin-panel-title-area">
                <h4 class="admin-panel-title" style="font-size: 0.95rem;">
                    <i class="fas fa-list text-muted"></i> 接口源列表
                </h4>
                <p class="admin-panel-desc">查看最新测试延迟、请求体配置，随时发起连通性自检。</p>
            </div>
        </div>

        <div class="data-table-shell">
            <table class="table">
                <thead>
                    <tr>
                        <th style="width: 50px; text-align: center;">#</th>
                        <th style="width: 80px; text-align: center;">状态</th>
                        <th style="width: 160px;">名字</th>
                        <th>接口 URL</th>
                        <th style="width: 80px; text-align: center;">方法</th>
                        <th style="width: 95px; text-align: center;">耗时</th>
                        <th style="width: 80px; text-align: center;">请求体</th>
                        <th style="width: 80px; text-align: center;">规则</th>
                        <th style="width: 140px; text-align: center;">操作</th>
                    </tr>
                </thead>
                <tbody id="apiTableBody">
                    <tr>
                        <td colspan="9" class="text-center text-muted py-4">
                            <i class="fas fa-spinner fa-spin me-2"></i> 正在加载 API 列表...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>

<!-- 新建 API 模态框 -->
<div class="modal fade" id="addApiModal" tabindex="-1" aria-labelledby="addApiModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addApiModalLabel">
                    <i class="fas fa-plus-circle text-primary me-1"></i> 新建 API 检索源
                </h5>
                <button type="button" class="btn-close" data-ui-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <form id="addApiForm">
                    <fieldset>
                        <legend>基础信息</legend>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="apiName" class="form-label">
                                    接口名称 <span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control" id="apiName" placeholder="例如：某网盘搜索源1" required>
                            </div>
                            <div class="col-md-3">
                                <label for="apiMethod" class="form-label">
                                    请求方法 <span class="text-danger">*</span>
                                </label>
                                <select class="form-select" id="apiMethod" required>
                                    <option value="get">GET</option>
                                    <option value="post" selected>POST</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="apiIsEnabled" class="form-label">
                                    默认状态 <span class="text-danger">*</span>
                                </label>
                                <select class="form-select" id="apiIsEnabled" required>
                                    <option value="true">启用</option>
                                    <option value="false">禁用</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="apiUrl" class="form-label">
                                接口 URL <span class="text-danger">*</span>
                                <span class="text-muted fw-normal">（需嵌入 <code>[[keyword]]</code> 作为关键词占位符）</span>
                            </label>
                            <input type="text" class="form-control font-mono" id="apiUrl" placeholder="例：https://api.example.com/search?q=[[keyword]]" required>
                        </div>
                    </fieldset>

                    <fieldset class="mt-3">
                        <legend class="d-flex align-items-center justify-content-between">
                            <span>请求体配置 (JSON)</span>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="formatJson('apiRequest')">
                                <i class="fas fa-magic"></i> 格式化
                            </button>
                        </legend>
                        <div class="mb-3">
                            <textarea class="form-control font-mono" id="apiRequest" rows="3" placeholder='例：{"query": "[[keyword]]"}'></textarea>
                        </div>
                    </fieldset>

                    <fieldset class="mt-3">
                        <legend>响应解析规则 (JMESPath)</legend>
                        <div class="mb-3">
                            <label for="apiResponse" class="form-label">
                                提取规则表达式 <span class="text-danger">*</span>
                                <a href="https://jmespath.org/tutorial.html" target="_blank" class="ms-2 small text-primary" title="JMESPath 语法教程">
                                    <i class="fas fa-external-link-alt"></i> 语法教程
                                </a>
                            </label>
                            <textarea class="form-control font-mono" id="apiResponse" rows="2" placeholder="例：data[*].[name, url]" required></textarea>
                        </div>
                    </fieldset>
                </form>
            </div>
            <div class="modal-footer d-flex justify-content-between">
                <div>
                    <button type="button" class="btn btn-outline-primary btn-sm" id="apiTestButton" onclick="testDraftApi('api')">
                        <i class="fas fa-play me-1"></i> 测试单次连通
                    </button>
                </div>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="document.getElementById('addApiForm').reset()">
                        重置
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm" data-ui-dismiss="modal">
                        取消
                    </button>
                    <button type="button" class="btn btn-primary btn-sm" onclick="addApi()">
                        <i class="fas fa-save me-1"></i> 保存入库
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 修改 API 模态框 -->
<div class="modal fade" id="editApiModal" tabindex="-1" aria-labelledby="editApiModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editApiModalLabel">
                    <i class="fas fa-edit text-primary me-1"></i> 修改 API 检索源
                </h5>
                <button type="button" class="btn-close" data-ui-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <form id="editApiForm">
                    <input type="hidden" id="editApiId">
                    <fieldset>
                        <legend>基础信息</legend>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="editApiName" class="form-label">
                                    接口名称 <span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control" id="editApiName" required>
                            </div>
                            <div class="col-md-3">
                                <label for="editApiMethod" class="form-label">
                                    请求方法 <span class="text-danger">*</span>
                                </label>
                                <select class="form-select" id="editApiMethod" required>
                                    <option value="get">GET</option>
                                    <option value="post">POST</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="editApiIsEnabled" class="form-label">
                                    启用状态 <span class="text-danger">*</span>
                                </label>
                                <select class="form-select" id="editApiIsEnabled" required>
                                    <option value="true">启用</option>
                                    <option value="false">禁用</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="editApiUrl" class="form-label">
                                接口 URL <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control font-mono" id="editApiUrl" required>
                        </div>
                    </fieldset>

                    <fieldset class="mt-3">
                        <legend class="d-flex align-items-center justify-content-between">
                            <span>请求体配置 (JSON)</span>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="formatJson('editApiRequest')">
                                <i class="fas fa-magic"></i> 格式化
                            </button>
                        </legend>
                        <div class="mb-3">
                            <textarea class="form-control font-mono" id="editApiRequest" rows="3"></textarea>
                        </div>
                    </fieldset>

                    <fieldset class="mt-3">
                        <legend>响应解析规则 (JMESPath)</legend>
                        <div class="mb-3">
                            <label for="editApiResponse" class="form-label">
                                提取规则表达式 <span class="text-danger">*</span>
                            </label>
                            <textarea class="form-control font-mono" id="editApiResponse" rows="2" required></textarea>
                        </div>
                    </fieldset>
                </form>
            </div>
            <div class="modal-footer d-flex justify-content-between">
                <div>
                    <button type="button" class="btn btn-outline-primary btn-sm" id="editApiTestButton" onclick="testDraftApi('editApi')">
                        <i class="fas fa-play me-1"></i> 测试单次连通
                    </button>
                </div>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-secondary btn-sm" data-ui-dismiss="modal">
                        取消
                    </button>
                    <button type="button" class="btn btn-primary btn-sm" onclick="saveEditedApi()">
                        <i class="fas fa-save me-1"></i> 保存修改
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
